# $host port'u dusurur (8080:80 gibi port mapping'lerde TAXII URL'leri kirilir);
# $http_host Host header'i port dahil korur. Host header'siz (HTTP/1.0)
# isteklerde $host'a geri duseriz.
map $http_host $taxii_base_host {
    default $http_host;
    ''      $host;
}

# TAXII objects/manifest dizin istegindeki ?next=NNNN cursor'unu sayfa numarasina
# cevirir. Yalniz rakam kabul eder (path traversal'a kapali); cursor yoksa ilk sayfa.
map $arg_next $taxii_page {
    default          "0001";
    "~^[0-9]{1,6}$"  $arg_next;
}

server {
    listen 80 default_server;
    server_name _;
    root /data/docs;
    index index.html;

    autoindex off;

    # docs/ feed'leri: domain-list.txt, ip-list.txt, stats.json, ...
    location ~* \.(txt|json)$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- TAXII 2.1 servisi (docs/taxii/ ciktisi) ---
    # build_taxii.py statik bir TAXII agaci uretir; nginx onu olduğu gibi
    # serve eder. __TAXII_BASE__ placeholder'i kendi host'umuza rewrite ederiz.
    # Not: ?added_after=&limit=&next= query semantigi Cloudflare Worker'da
    # implementlidir; nginx-only sunumda client sayfa-sayfa cursor ile gezer.
    location ^~ /taxii2/ {
        alias /data/docs/taxii/taxii2/;
        # .json mime eslemesini temizle ki default_type (TAXII media type) gecerli olsun.
        types { }
        default_type "application/taxii+json;version=2.1";
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        sub_filter '__TAXII_BASE__' '$scheme://$taxii_base_host';
        sub_filter_once off;
        # types{} ile content-type artik 'application/taxii+json;version=2.1';
        # sub_filter_types'in parametreli tipi eslemesi guvenilir degil, bu yuzden
        # '*' ile tum tiplerde rewrite et (bu konum yalniz discovery'yi servis eder).
        sub_filter_types *;
        try_files $uri ${uri}index.json =404;
    }

    location ^~ /api/ {
        alias /data/docs/taxii/api/;
        # .json mime eslemesini temizle ki default_type (TAXII media type) gecerli olsun.
        # Alt location'lar bu bos types{} bloğunu miras alir.
        types { }
        default_type "application/taxii+json;version=2.1";
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        sub_filter '__TAXII_BASE__' '$scheme://$taxii_base_host';
        sub_filter_once off;
        sub_filter_types application/json application/taxii+json;

        # objects/ ve manifest/ dizin istegi (TAXII client'larin cagirdigi yol):
        # ?next=NNNN cursor'unu gercek sayfa dosyasina IC YONLENDIR; asagidaki
        # page-* location'i dogru content-type + alias ile servis eder. Cursor
        # yoksa ilk sayfa. NOT: nginx-only modda yalniz `next` cursor pagination
        # calisir; ?added_after= ve ?limit= filtreleri yalniz Cloudflare Worker
        # modelinde uygulanir (statik sunumda tum sayfa dondurulur).
        # Named capture'lar ($col/$kind) $taxii_page map regex'inin numarali
        # capture'lari ($1/$2) ezmesine karsi korur.
        location ~ ^/api/collections/(?<col>[a-z0-9-]+)/(?<kind>objects|manifest)/$ {
            rewrite ^ /api/collections/$col/$kind/page-$taxii_page.json last;
        }

        # STIX objesi sayfalari -> application/stix+json
        location ~ /api/collections/[^/]+/objects/page-[0-9]+\.json$ {
            default_type "application/taxii+json;version=2.1";
        }
        location ~ /api/collections/[^/]+/manifest/page-[0-9]+\.json$ {
            default_type "application/taxii+json;version=2.1";
        }
        # index.json (api root, collections, collection-meta, pages.json) icin
        # content-type yukaridaki types{} + default_type ile zaten TAXII media type.
        try_files $uri ${uri}index.json =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ /\. { deny all; }
    location ~ \.partial$ { deny all; }
    location ~ \.tmp$ { deny all; }
    location ~ \.db(-wal|-shm)?$ { deny all; }
}
