# SGB API Bridge nginx: statik feed'leri (txt/json/html) servis eder; TAXII 2.1
# rotalarini (/taxii2/, /api/) taxii_server.py'ye (uvicorn 127.0.0.1:8081)
# proxy'ler. TAXII sorgu semantigi (added_after/limit/next) ve __TAXII_BASE__
# rewrite artik UYGULAMADA — nginx yalniz onunde durur.

server {
    listen 80 default_server;
    server_name _;
    root /data/docs;
    index index.html;

    autoindex off;

    # docs/ feed'leri: domain-list.txt, ip-list.txt, stats.json, ...
    # (^~ ile /taxii2/ ve /api/ bu regex'ten once eslesir; cakisma yok.)
    location ~* \.(txt|json)$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- TAXII 2.1 servisi (taxii_server.py / uvicorn) ---
    # Host + X-Forwarded-Proto ile uygulama dogru base'i (discovery api_roots)
    # uretir; musteri kendi domain'i/TLS-proxy'si arkasinda olsa bile dogru calisir.
    location ^~ /taxii2/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ~ /\. { deny all; }
    location ~ \.partial$ { deny all; }
    location ~ \.tmp$ { deny all; }
    location ~ \.db(-wal|-shm)?$ { deny all; }
}
