# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Python — requirements.txt (sync script'leri: requests)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Node — Cloudflare TAXII worker (wrangler, typescript, workers-types)
  - package-ecosystem: "npm"
    directory: "/cloudflare/taxii-worker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions — workflow'larda kullanilan action'lar
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Docker — base image (python:3.11-slim)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
