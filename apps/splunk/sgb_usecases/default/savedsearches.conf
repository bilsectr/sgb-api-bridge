[SGB - UC-OT-001 - OT baseline (info)]
disabled = 1
enableSched = 1
cron_schedule = 38 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 2
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_all_indexes` \
| lookup sgb_ip_lookup value AS dest_ip OUTPUT connectiontype AS ct_ip \
| lookup sgb_domain_lookup value AS query OUTPUT connectiontype AS ct_dom \
| where ct_ip="OT" OR ct_dom="OT" \
| bin _time span=1h \
| stats count AS hits by _time \
| where hits>100 \
| eval severity=3, sgb_uc="UC-OT-001", sgb_ct="OT"
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-OT-001 - OT baseline (info)
action.correlationsearch.annotations = {"context": ["source:SGB", "bg_rehberi:3.1.10.4", "bg_rehberi:3.1.8.7", "tier:3"]}
description = [Tier 3] Siniflandirilmamis (OT) indicator hit'leri saatte 100'u asti — bilgilendirme baseline'i. OT=Other'dir, Operational Technology degildir. Kanonik tanim: docs/usecases/UC-OT-001.md.

# =========================================================================
# XX — Cross / Meta kurallar (sgb_summary'den beslenir)
# =========================================================================

[SGB - UC-XX-001 - Asset hit 2+ CTs in 24h]
disabled = 1
enableSched = 1
cron_schedule = 42 * * * *
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
alert.severity = 4
action.summary_index = 1
action.summary_index._name = sgb_summary
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 4h
search = `sgb_notable_index` sgb_ct!="XX" \
| stats dc(sgb_ct) AS n_cts, values(sgb_ct) AS ct_list, count AS hits by src_ip \
| where n_cts>=2 \
| eval severity=8, sgb_uc="UC-XX-001", sgb_ct="XX"
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-XX-001 - Asset hit 2+ CTs in 24h
action.correlationsearch.annotations = {"mitre_attack": ["T1071"], "context": ["source:SGB", "bg_rehberi:3.1.8.7", "bg_rehberi:3.1.10.8", "tier:2"]}
description = [Tier 2 - meta] Ayni asset 24 saatte 2+ farkli connectiontype'a dokundu (or. PH sonrasi BC) — cok asamali saldiri sinyali. Diger UC'lerin sgb_summary ciktisindan beslenir. Kanonik tanim: docs/usecases/UC-XX-001.md.

[SGB - UC-XX-002 - Re-infection (same indicator 2x in 7d)]
disabled = 1
enableSched = 1
cron_schedule = 15 2 * * *
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
alert.severity = 4
action.summary_index = 1
action.summary_index._name = sgb_summary
alert.suppress = 1
alert.suppress.fields = src_ip, sgb_indicator_value
alert.suppress.period = 24h
search = `sgb_notable_index` sgb_ct!="XX" \
| stats dc(_time) AS hits, count AS total, values(sgb_ct) AS ct by src_ip, sgb_indicator_value \
| where hits>=2 \
| eval severity=7, sgb_uc="UC-XX-002", sgb_ct="XX"
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-XX-002 - Re-infection (same indicator 2x in 7d)
action.correlationsearch.annotations = {"context": ["source:SGB", "bg_rehberi:3.1.8.7", "bg_rehberi:3.1.10.8", "tier:2"]}
description = [Tier 2 - meta] Ayni asset ayni indicator'a 7 gunde 2+ kez dokundu — onceki temizlik basarisiz (re-infection). Kanonik tanim: docs/usecases/UC-XX-002.md.

[SGB - UC-XX-003 - Org-wide severity spike]
disabled = 1
enableSched = 1
cron_schedule = 44 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 5
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_notable_index` sgb_ct!="XX" \
| bin _time span=1h \
| stats avg(severity) AS avg_sev, count AS hits by _time \
| where avg_sev>7 AND hits>50 \
| eval severity=min(10, ceil(avg_sev)), sgb_uc="UC-XX-003", sgb_ct="XX"
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-XX-003 - Org-wide severity spike
action.correlationsearch.annotations = {"context": ["source:SGB", "bg_rehberi:3.1.8.7", "bg_rehberi:3.1.10.5", "tier:3"]}
description = [Tier 3 - meta] Kurum genelinde SGB alarm hacmi + ortalama severity ayni anda yukseldi — kampanya/dalga gostergesi. Kanonik tanim: docs/usecases/UC-XX-003.md.

[SGB - UC-XX-004 - Feed count drop check]
disabled = 1
enableSched = 1
cron_schedule = 46 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
alert.severity = 3
action.summary_index = 1
action.summary_index._name = sgb_summary
search = | inputlookup sgb_feed_count_history \
| sort - _time \
| streamstats count AS rank by feed \
| where rank<=2 \
| stats latest(n) AS now_n, earliest(n) AS prev_n by feed \
| eval drop_pct=round(100*(prev_n-now_n)/prev_n, 1) \
| where drop_pct>20 \
| eval severity=5, sgb_uc="UC-XX-004", sgb_ct="XX"
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-XX-004 - Feed count drop check
action.correlationsearch.annotations = {"context": ["source:SGB", "bg_rehberi:3.1.8.8", "bg_rehberi:3.1.10.4", "tier:1"]}
description = [Tier 1 - operasyonel] Feed indicator sayisi bir onceki snapshot'a gore %20+ dustu — feed sagligi alarmi. "Insan baksin" demektir, "feed bozuk" demek degildir (kalibrasyon notlari: docs/usecases/UC-XX-004.md). TA'daki feed count history snapshot'ina bagimlidir.

[SGB - UC-XX-004B - TAXII ingest stalled]
disabled = 1
enableSched = 1
cron_schedule = 48 * * * *
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
alert.severity = 3
action.summary_index = 1
action.summary_index._name = sgb_summary
search = | tstats max(_indextime) AS last_ingest WHERE `sgb_ti_index` BY source \
| eval lag_sec=now()-last_ingest \
| where lag_sec>7200 \
| eval severity=5, sgb_uc="UC-XX-004", sgb_ct="XX"
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-XX-004B - TAXII ingest stalled
action.correlationsearch.annotations = {"context": ["source:SGB", "bg_rehberi:3.1.8.8", "bg_rehberi:3.1.10.4", "tier:1"]}
description = [Tier 1 - operasyonel] Bir TAXII input'u 2+ saattir yeni event yazmadi. Not: feed'de o saat hic degisiklik olmamasi da normaldir; surekli tetikleniyorsa input loglarina bakin (index=_internal sgb_taxii). Kanonik tanim: docs/usecases/UC-XX-004.md.

[SGB - UC-XX-005 - Retro-hunt new indicators]
disabled = 1
enableSched = 1
cron_schedule = 45 2 * * *
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
alert.severity = 3
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_retrohunt_indexes` \
  [| inputlookup sgb_indicators \
   | where type="domain" AND added_utc>=strftime(relative_time(now(), "-1d"), "%Y-%m-%dT%H:%M:%S") \
   | fields value | rename value AS query | format] \
| stats count, min(_time) AS first_seen by src_ip, query \
| lookup sgb_domain_lookup value AS query OUTPUT connectiontype \
| eval severity=case(connectiontype="AC", 10, connectiontype="BC", 8, connectiontype="EK", 8, connectiontype="MF", 7, connectiontype="MC", 7, connectiontype="PH", 5, true(), 3) \
| eval alert_type="retro-hunt", event_time=strftime(first_seen, "%F %T"), sgb_uc="UC-XX-005", sgb_ct=coalesce(connectiontype, "XX"), sgb_indicator_value=query
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-XX-005 - Retro-hunt new indicators
action.correlationsearch.annotations = {"context": ["source:SGB", "bg_rehberi:3.1.8.6", "bg_rehberi:3.1.8.7", "tier:2"]}
description = [Tier 2 - meta] Son 24 saatte feed'e eklenen domain'ler icin 30 gunluk gecmis logda retro-hunt (gece kosar, agirdir). IP retro-hunt icin pencereyi 7-14 gune dusurun (IP churn). Subsearch limiti ~10K yeni indicator/gun. Kanonik tanim: docs/usecases/UC-XX-005.md.

[SGB - UC-XX-006 - Inbound from SGB-listed IP]
disabled = 1
enableSched = 1
cron_schedule = 50 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 4
action.summary_index = 1
action.summary_index._name = sgb_summary
search = (`sgb_vpn_index`) OR (`sgb_auth_index`) OR (`sgb_waf_index`) \
| lookup sgb_ip_lookup value AS src_ip OUTPUT connectiontype, source \
| where isnotnull(connectiontype) \
| eval base=case(connectiontype="AC", 10, connectiontype="BC", 7, true(), 5) \
| eval severity=min(10, base+if(action="success", 2, 0)) \
| stats count, values(action) AS actions, values(user) AS users by src_ip, connectiontype, severity, source \
| eval sgb_uc="UC-XX-006", sgb_ct=connectiontype, sgb_indicator_value=src_ip
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-XX-006 - Inbound from SGB-listed IP
action.correlationsearch.annotations = {"mitre_attack": ["T1133", "T1110"], "context": ["source:SGB", "bg_rehberi:3.1.6.4", "bg_rehberi:3.1.8.7", "tier:2"]}
description = [Tier 2] SGB listesindeki IP'den kuruma inbound erisim (VPN/auth/WAF). Basarili oturum +2 severity. CGN/dinamik ISP IP FP notlarina bakin. Kanonik tanim: docs/usecases/UC-XX-006.md.
