[SGB - UC-EK-001 - Exploit kit URL request]
disabled = 1
enableSched = 1
cron_schedule = 22 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 5
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_proxy_index` \
