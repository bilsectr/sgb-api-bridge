description = [Tier 3] SGB exploit kit URL'sine HTTP istegi. EK koleksiyonu cok kucuk — tetiklenme beklemeyin ama maliyetsiz. Kanonik tanim: docs/usecases/UC-EK-001.md.

[SGB - UC-EK-002 - IDS + SGB EK composite]
disabled = 1
enableSched = 1
cron_schedule = 24 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 5
action.summary_index = 1
action.summary_index._name = sgb_summary
search = (`sgb_ids_index` category IN ("browser-exploit", "client-vuln")) OR (`sgb_proxy_index`) \
| lookup sgb_url_lookup value AS url OUTPUT connectiontype AS sgb_url_ct \
| lookup sgb_ip_lookup value AS dest_ip OUTPUT connectiontype AS sgb_dest_ct \
| transaction src_ip, dest_ip maxspan=5m \
| eval sig_all=mvjoin(mvappend(signature), " "), ct_all=mvjoin(mvappend(sgb_url_ct, sgb_dest_ct), " ") \
| where like(sig_all, "%exploit%") AND like(ct_all, "%EK%") \
| eval severity=9, sgb_uc="UC-EK-002", sgb_ct="EK", sgb_indicator_value=coalesce(url, dest_ip) \
| table _time, src_ip, dest_ip, sig_all, severity, sgb_uc, sgb_ct, sgb_indicator_value
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-EK-002 - IDS + SGB EK composite
action.correlationsearch.annotations = {"mitre_attack": ["T1189", "T1203"], "context": ["source:SGB", "bg_rehberi:3.1.6.18", "bg_rehberi:3.1.6.28", "tier:3"]}
description = [Tier 3] IDS exploit imzasi + SGB EK eslesmesi ayni src/dest'te 5 dk icinde (composite). Kanonik tanim: docs/usecases/UC-EK-002.md.

