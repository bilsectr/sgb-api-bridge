# MF — Malware Download (TAXII: sgb-malware-download)
# =========================================================================

[SGB - UC-MF-001 - Malware URL download]
disabled = 1
enableSched = 1
cron_schedule = 26 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 4
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_proxy_index` http_status IN (200, 206) bytes_in>1024 \
| lookup sgb_url_lookup value AS url OUTPUT connectiontype, criticality_level, source \
| where connectiontype="MF" AND `sgb_ih_filter` \
| eval severity=`sgb_severity(7, criticality_level)` \
| stats values(url) AS urls, sum(bytes_in) AS total_bytes by src_ip, source, severity \
| eval sgb_uc="UC-MF-001", sgb_ct="MF", sgb_indicator_value=mvjoin(urls, " ")
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-MF-001 - Malware URL download
action.correlationsearch.annotations = {"mitre_attack": ["T1105"], "context": ["source:SGB", "bg_rehberi:3.1.5.1", "bg_rehberi:3.1.6.20", "tier:2"]}
description = [Tier 2] SGB malware URL'sinden basarili indirme (HTTP 200/206, >1KB). Kanonik tanim: docs/usecases/UC-MF-001.md.

[SGB - UC-MF-002 - EDR malware file fetched]
disabled = 1
enableSched = 1
cron_schedule = 28 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 4
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_edr_index` (action=process_network OR action=file_create) \
| lookup sgb_domain_lookup value AS dest_host OUTPUT connectiontype AS ct_dom \
| lookup sgb_ip_lookup value AS dest_host OUTPUT connectiontype AS ct_ip \
| eval sgb_hit=if(ct_dom="MF" OR ct_ip="MF", 1, 0) \
| stats values(action) AS actions, max(sgb_hit) AS has_sgb, values(dest_host) AS dest_hosts, values(file_path) AS files, min(_time) AS t_min by process_guid, host \
| where mvcount(actions)=2 AND has_sgb=1 \
| eval severity=8, sgb_uc="UC-MF-002", sgb_ct="MF", src_ip=host, sgb_indicator_value=mvjoin(dest_hosts, " ")
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-MF-002 - EDR malware file fetched
action.correlationsearch.annotations = {"mitre_attack": ["T1105"], "context": ["source:SGB", "bg_rehberi:3.1.5.1", "bg_rehberi:3.1.5.6", "tier:2"]}
description = [Tier 2] Ayni process hem SGB MF host'una baglandi hem dosya yazdi (EDR composite). Kanonik tanim: docs/usecases/UC-MF-002.md.

# =========================================================================
# MM — Cryptomining (TAXII: sgb-mining)
# =========================================================================

[SGB - UC-MM-001 - Mining pool outbound]
disabled = 1
enableSched = 1
cron_schedule = 30 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 2
action.summary_index = 1
action.summary_index._name = sgb_summary
search = (`sgb_firewall_index`) OR (`sgb_dns_index`) \
| lookup sgb_ip_lookup value AS dest_ip OUTPUT connectiontype AS ct_ip, criticality_level, source \
| lookup sgb_domain_lookup value AS query OUTPUT connectiontype AS ct_dom \
| where (ct_ip="MM" OR ct_dom="MM") AND `sgb_ih_filter` \
| eval severity=`sgb_severity(3, criticality_level)` \
| fillnull value="-" dest_ip, query \
| stats count by src_ip, dest_ip, query, source, severity \
| eval sgb_uc="UC-MM-001", sgb_ct="MM", sgb_indicator_value=if(query!="-", query, dest_ip)
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-MM-001 - Mining pool outbound
action.correlationsearch.annotations = {"mitre_attack": ["T1496"], "context": ["source:SGB", "bg_rehberi:3.1.6.4", "bg_rehberi:3.1.6.5", "tier:3"]}
description = [Tier 3] SGB mining indicator'ina outbound. Dusuk severity, bilgilendirme agirlikli. Kanonik tanim: docs/usecases/UC-MM-001.md.

[SGB - UC-MM-002 - CPU spike + SGB MM composite]
disabled = 1
enableSched = 1
cron_schedule = 32 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 4
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_edr_perf_index` \
| stats avg(cpu_pct) AS avg_cpu by host \
| where avg_cpu>85 \
| join type=inner host [search `sgb_notable_index` sgb_ct="MM" | stats count AS mm_hits, values(sgb_indicator_value) AS mm_destinations by src_ip | rename src_ip AS host] \
| eval severity=5, sgb_uc="UC-MM-002", sgb_ct="MM", src_ip=host, sgb_indicator_value=mvjoin(mm_destinations, " ")
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-MM-002 - CPU spike + SGB MM composite
action.correlationsearch.annotations = {"mitre_attack": ["T1496"], "context": ["source:SGB", "bg_rehberi:3.1.5.1", "bg_rehberi:3.1.10.8", "tier:3"]}
description = [Tier 3] CPU %85+ ve ayni host'ta SGB MM hit'i (composite) — aktif mining kaniti. UC-MM-001 acik olmali. Kanonik tanim: docs/usecases/UC-MM-002.md.

