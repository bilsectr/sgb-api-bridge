# SGB SIEM Use Case kutuphanesi — 24 kural.
# Kanonik tanimlar: https://github.com/bilsectr/sgb-api-bridge/tree/main/docs/usecases
#
# - Tum kurallar DISABLED gelir. Devreye alma sirasi (usecases/README.md#tiers):
#     Tier 1: UC-XX-004 (A+B), UC-PH-001/002/003, UC-BC-001/002, UC-AC-001/002
#     Tier 2: UC-BC-003/004, UC-MF-*, UC-MC-*, UC-XX-001/002/005/006
#     Tier 3: UC-EK-*, UC-MM-*, UC-OT-001, UC-XX-003
# - Once macros.conf'taki veri kaynagi makrolarini ortaminiza cevirin.
# - Her kural tetiklendiginde sonuc "sgb_summary" summary index'ine yazilir;
#   UC-XX-* meta kurallari ve dashboard'lar oradan beslenir.
# - ES kullananlar: action.correlationsearch annotation'lari ES Use Case
#   Library'de gorunur; notable uretmek icin ilgili kuralda action.notable'i
#   kendiniz acin.

[default]
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.suppress = 0
request.ui_dispatch_app = sgb_usecases

# =========================================================================
# PH — Phishing (TAXII: sgb-phishing)
# =========================================================================

[SGB - UC-PH-001 - Phishing DNS query]
disabled = 1
enableSched = 1
cron_schedule = 6 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 4
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_dns_index` \
| lookup sgb_domain_lookup value AS query OUTPUT connectiontype, criticality_level, source \
| where connectiontype="PH" AND `sgb_ih_filter` \
| eval severity=`sgb_severity(5, criticality_level)` \
| stats count, latest(_time) AS last_seen by src_ip, query, source, severity \
| eval sgb_uc="UC-PH-001", sgb_ct="PH", sgb_indicator_value=query
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-PH-001 - Phishing DNS query
action.correlationsearch.annotations = {"mitre_attack": ["T1566.002"], "context": ["source:SGB", "bg_rehberi:3.1.5.7", "bg_rehberi:3.1.6.20", "tier:1"]}
description = [Tier 1] Kurum icinden SGB phishing domain'ine DNS sorgusu. Kanonik tanim: docs/usecases/UC-PH-001.md. Veri kaynagi: `sgb_dns_index` makrosu.

[SGB - UC-PH-002 - Proxy phishing URL]
disabled = 1
enableSched = 1
cron_schedule = 8 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 4
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_proxy_index` \
| lookup sgb_url_lookup value AS url OUTPUT connectiontype, criticality_level, source \
| where connectiontype="PH" AND `sgb_ih_filter` \
| eval severity=`sgb_severity(5, criticality_level)` \
| stats count by src_ip, url, source, severity \
| eval sgb_uc="UC-PH-002", sgb_ct="PH", sgb_indicator_value=url
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-PH-002 - Proxy phishing URL
action.correlationsearch.annotations = {"mitre_attack": ["T1566.002"], "context": ["source:SGB", "bg_rehberi:3.1.6.20", "bg_rehberi:3.1.6.22", "tier:1"]}
description = [Tier 1] Proxy uzerinden SGB phishing URL'sine HTTP istegi. Kanonik tanim: docs/usecases/UC-PH-002.md.

[SGB - UC-PH-003 - Email phishing link delivered]
disabled = 1
enableSched = 1
cron_schedule = 10 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 4
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_mail_index` action=delivered \
| rex field=body "https?://(?<body_domain>[^/\"\s]+)" \
| lookup sgb_domain_lookup value AS body_domain OUTPUT connectiontype, criticality_level, source \
| where connectiontype="PH" AND `sgb_ih_filter` \
| eval severity=`sgb_severity(6, criticality_level)` \
| stats values(recipient) AS recipients, count by sender, body_domain, source, severity \
| eval sgb_uc="UC-PH-003", sgb_ct="PH", sgb_indicator_value=body_domain
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-PH-003 - Email phishing link delivered
action.correlationsearch.annotations = {"mitre_attack": ["T1566.002"], "context": ["source:SGB", "bg_rehberi:3.1.4.10", "tier:1"]}
description = [Tier 1] Teslim edilen mail govdesinde SGB phishing domain'ine link. Kanonik tanim: docs/usecases/UC-PH-003.md. Email gateway URL rewriting decode'u gerektirebilir (FP notlari).

# =========================================================================
# BC — Botnet C&C (TAXII: sgb-botnet-cc)
# =========================================================================

[SGB - UC-BC-001 - Botnet C2 outbound]
disabled = 1
enableSched = 1
cron_schedule = 12 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 5
action.summary_index = 1
action.summary_index._name = sgb_summary
search = (`sgb_firewall_index` action=allowed) OR (`sgb_netflow_index`) \
| lookup sgb_ip_lookup value AS dest_ip OUTPUT connectiontype, criticality_level, source \
| where connectiontype="BC" \
| eval severity=`sgb_severity(8, criticality_level)` \
| stats count, values(dest_ip) AS dest_ips by src_ip, source, severity \
| eval sgb_uc="UC-BC-001", sgb_ct="BC", sgb_indicator_value=mvjoin(dest_ips, " ")
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-BC-001 - Botnet C2 outbound
action.correlationsearch.annotations = {"mitre_attack": ["T1071"], "context": ["source:SGB", "bg_rehberi:3.1.5.1", "bg_rehberi:3.1.6.4", "bg_rehberi:3.1.6.5", "tier:1"]}
description = [Tier 1] SGB botnet C&C IP'sine izin verilmis outbound baglanti. source=IH dahi alarm acilir (README severity bolumu). Kanonik tanim: docs/usecases/UC-BC-001.md.

[SGB - UC-BC-002 - Botnet C2 DNS query]
disabled = 1
enableSched = 1
cron_schedule = 14 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 5
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_dns_index` \
| lookup sgb_domain_lookup value AS query OUTPUT connectiontype, criticality_level, source \
| where connectiontype="BC" \
| eval severity=`sgb_severity(8, criticality_level)` \
| stats count, values(query) AS queried_domains by src_ip, source, severity \
| eval sgb_uc="UC-BC-002", sgb_ct="BC", sgb_indicator_value=mvjoin(queried_domains, " ")
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-BC-002 - Botnet C2 DNS query
action.correlationsearch.annotations = {"mitre_attack": ["T1071.004", "T1568.002"], "context": ["source:SGB", "bg_rehberi:3.1.5.7", "bg_rehberi:3.1.6.4", "tier:1"]}
description = [Tier 1] SGB botnet C&C domain'ine DNS sorgusu. Sinkhole domain'leri icin FP notuna bakin. Kanonik tanim: docs/usecases/UC-BC-002.md.

[SGB - UC-BC-003 - Beacon pattern to SGB IP]
disabled = 1
enableSched = 1
cron_schedule = 16 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time = now
alert.severity = 5
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_netflow_index` \
| lookup sgb_ip_lookup value AS dest_ip OUTPUT connectiontype \
| where connectiontype="BC" \
| sort 0 src_ip dest_ip _time \
| streamstats current=f window=1 last(_time) AS prev_time by src_ip, dest_ip \
| eval interval=_time-prev_time \
| stats count AS flows, median(interval) AS med, stdev(interval) AS sd, avg(bytes) AS avg_b, values(dest_ip) AS dest_ips by src_ip \
| where flows>=5 AND med<60 AND sd<20 AND avg_b<4096 \
| eval severity=9, sgb_uc="UC-BC-003", sgb_ct="BC", sgb_indicator_value=mvjoin(dest_ips, " ")
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-BC-003 - Beacon pattern to SGB IP
action.correlationsearch.annotations = {"mitre_attack": ["T1071", "T1029"], "context": ["source:SGB", "bg_rehberi:3.1.6.4", "bg_rehberi:3.1.6.18", "tier:2"]}
description = [Tier 2] SGB BC IP'sine dusuk-bant periyodik beacon (NetFlow). Kanonik tanim: docs/usecases/UC-BC-003.md.

[SGB - UC-BC-004 - DNS answer resolves to SGB C2 IP]
disabled = 1
enableSched = 1
cron_schedule = 18 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 5
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_dns_index` (sourcetype="zeek:dns" OR (sourcetype="XmlWinEventLog" EventCode=22)) \
| eval answer=coalesce(answers, QueryResults) \
| makemv delim=";" answer \
| mvexpand answer \
| where NOT answer IN ("0.0.0.0", "127.0.0.1", "::") \
| lookup sgb_ip_lookup value AS answer OUTPUT connectiontype, criticality_level, source \
| where connectiontype IN ("BC", "AC") \
| eval severity=if(connectiontype="AC", 10, `sgb_severity(8, criticality_level)`) \
| stats count, values(query) AS candidate_domains by src_ip, answer, connectiontype, severity, source \
| eval sgb_uc="UC-BC-004", sgb_ct=connectiontype, sgb_indicator_value=answer
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-BC-004 - DNS answer resolves to SGB C2 IP
action.correlationsearch.annotations = {"mitre_attack": ["T1568", "T1071.004"], "context": ["source:SGB", "bg_rehberi:3.1.5.7", "bg_rehberi:3.1.6.4", "tier:2"]}
description = [Tier 2] DNS cevabi SGB BC/AC IP'sine cozumleniyor. CDN/paylasimli hosting FP'lerine dikkat (FP notlari). Kanonik tanim: docs/usecases/UC-BC-004.md.

# =========================================================================
# AC — APT C&C (TAXII: sgb-apt-cc)
# =========================================================================

[SGB - UC-AC-001 - APT C2 match]
disabled = 1
enableSched = 1
cron_schedule = 20 * * * *
dispatch.earliest_time = -65m@m
dispatch.latest_time = now
alert.severity = 6
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_all_indexes` \
| eval test_values=mvappend(src_ip, dest_ip, url, query, hostname) \
| mvexpand test_values \
| lookup sgb_ip_lookup value AS test_values OUTPUT connectiontype AS ct_ip \
| lookup sgb_domain_lookup value AS test_values OUTPUT connectiontype AS ct_dom \
| lookup sgb_url_lookup value AS test_values OUTPUT connectiontype AS ct_url \
| where ct_ip="AC" OR ct_dom="AC" OR ct_url="AC" \
| eval severity=10 \
| stats count, latest(_time) AS last_seen by src_ip, test_values, severity \
| eval sgb_uc="UC-AC-001", sgb_ct="AC", sgb_indicator_value=test_values
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-AC-001 - APT C2 match
action.correlationsearch.annotations = {"mitre_attack": ["T1071"], "context": ["source:SGB", "bg_rehberi:3.1.10.4", "bg_rehberi:3.1.10.5", "bg_rehberi:3.1.10.8", "tier:1"]}
description = [Tier 1] Herhangi bir kaynakta SGB APT C&C eslesmesi — severity 10 sabit, source=IH dahi alarm. Performans: `sgb_all_indexes` makrosunu daralt. Kanonik tanim: docs/usecases/UC-AC-001.md.

[SGB - UC-AC-002 - APT confirmed (3+ matches)]
disabled = 1
enableSched = 1
cron_schedule = */15 * * * *
dispatch.earliest_time = -30m@m
dispatch.latest_time = now
alert.severity = 6
action.summary_index = 1
action.summary_index._name = sgb_summary
search = `sgb_notable_index` sgb_ct="AC" sgb_uc="UC-AC-001" \
| stats dc(sgb_indicator_value) AS distinct_matches, values(sgb_indicator_value) AS matched_values by src_ip \
| where distinct_matches>=3 \
| eval severity=10, sgb_uc="UC-AC-002", sgb_ct="AC", sgb_indicator_value=mvjoin(matched_values, " ")
action.correlationsearch.enabled = 1
action.correlationsearch.label = SGB - UC-AC-002 - APT confirmed (3+ matches)
action.correlationsearch.annotations = {"mitre_attack": ["T1071"], "context": ["source:SGB", "bg_rehberi:3.1.10.4", "bg_rehberi:3.1.10.5", "tier:1"]}
description = [Tier 1] Ayni asset 30 dk icinde 3+ farkli APT indicator'ina dokundu — kesin compromise sinyali. UC-AC-001 ciktilarindan (sgb_summary) beslenir; UC-AC-001 acik olmali. Kanonik tanim: docs/usecases/UC-AC-002.md.

