# --- Veri kaynagi makrolari -------------------------------------------------
# Kurulumdan sonra ILK IS: bu makrolari kendi ortaminizdaki index/sourcetype
# degerlerine cevirin (Settings > Advanced search > Search macros, app context
# sgb_usecases). UC'ler yalniz bu makrolar uzerinden veri okur.

[sgb_dns_index]
definition = index=dns
iseval = 0

[sgb_proxy_index]
definition = index=proxy
iseval = 0

[sgb_firewall_index]
definition = index=firewall
iseval = 0

[sgb_netflow_index]
definition = index=netflow
iseval = 0

[sgb_edr_index]
definition = index=edr
iseval = 0

[sgb_edr_perf_index]
definition = index=edr_perf
iseval = 0

[sgb_mail_index]
definition = index=mail
iseval = 0

[sgb_ids_index]
definition = index=ids
iseval = 0

[sgb_vpn_index]
definition = index=vpn
iseval = 0

[sgb_auth_index]
definition = index=auth
iseval = 0

[sgb_waf_index]
definition = index=waf
iseval = 0

[sgb_mdm_index]
definition = (index=mdm OR index=mobile_vpn)
iseval = 0

[sgb_mdm_app_index]
definition = (index=mdm sourcetype IN ("intune:app", "lookout", "zimperium"))
iseval = 0

# UC-AC-001 ve UC-OT-001'in taradigi genis kume — performans icin ortamina
# gore daralt.
[sgb_all_indexes]
definition = (index=dns OR index=proxy OR index=firewall OR index=netflow)
iseval = 0

# UC-XX-005 retro-hunt kapsami
[sgb_retrohunt_indexes]
definition = (index=proxy OR index=dns OR index=firewall)
iseval = 0

# --- Ic mekanizma makrolari --------------------------------------------------
# UC'lerin alarm ciktilarinin toplandigi summary index. "sgb_summary"
# index'ini kurulumda olusturun veya makroyu degistirin (savedsearches.conf
# action.summary_index._name ile tutarli kalmali).
[sgb_notable_index]
definition = index=sgb_summary sourcetype=stash
iseval = 0

# Severity formulu (usecases/README.md#severity):
# final = clamp(base + (criticality - 5) / 2, 1, 10)
[sgb_severity(2)]
args = base, crit
definition = min(10, max(1, $base$ + round((coalesce($crit$, 5) - 5) / 2, 0)))
iseval = 0

# source=IH (ihbar) kayitlari yuksek FP'li — AC/BC disindaki UC'ler bu
# filtreyi uygular (usecases/README.md "Source confidence"). IH'yi de almak
# isterseniz definition'i "true()" yapin.
[sgb_ih_filter]
definition = (coalesce(source, "") != "IH")
iseval = 0
