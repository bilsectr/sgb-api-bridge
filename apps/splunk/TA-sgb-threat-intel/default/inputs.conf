# SGB TAXII 2.1 koleksiyonlari — 8 connectiontype koleksiyonu.
# Varsayilan olarak disabled gelir; kurulumda "sgb_ti" index'ini olusturup
# (veya index= degerini degistirip) stanza'lari enable edin.
# Air-gapped / self-hosted ortamda discovery_url'i kendi TAXII host'unuza cevirin.

# python.version: Splunk 8.x-10.1 icin; python.required: 10.2+ icin
# (script stdlib-only, Python 3.7-3.13 uyumlu).
[sgb_taxii]
python.version = python3
python.required = 3.13

[sgb_taxii://SGB-Phishing]
discovery_url = https://sgb-taxii.bilsec.tr/taxii2/
collection = sgb-phishing
index = sgb_ti
sourcetype = sgb:stix:indicator
interval = 3600
disabled = 1

[sgb_taxii://SGB-Botnet-CC]
discovery_url = https://sgb-taxii.bilsec.tr/taxii2/
collection = sgb-botnet-cc
index = sgb_ti
sourcetype = sgb:stix:indicator
interval = 3600
disabled = 1

