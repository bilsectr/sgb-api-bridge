# SGB indicator lookup'lari. CSV'ler "SGB TA - Lookup Gen - *" scheduled
# search'leri tarafindan uretilir/tazelenir; pakette yalniz header iskeleti gelir.

[sgb_indicators]
filename = sgb_indicators.csv
case_sensitive_match = false

[sgb_domain_lookup]
filename = sgb_domain_lookup.csv
case_sensitive_match = false

[sgb_ip_lookup]
filename = sgb_ip_lookup.csv
match_type = CIDR(value)
case_sensitive_match = false

[sgb_url_lookup]
filename = sgb_url_lookup.csv
case_sensitive_match = false

[sgb_feed_count_history]
filename = sgb_feed_count_history.csv
