# Lookup ureticileri. Indexlenen STIX event'lerinden CSV lookup'lari tazeler.
# Hepsi varsayilan acik (input'lar disabled oldugu surece no-op'tur).
#
# Bilinen sinirlama: SGB feed'inden SILINEN kayitlar lookup'tan otomatik
# dusmez (TAXII incremental polling silme bilgisi tasimaz). Silmeler nadirdir;
# tam mutabakat icin checkpoint'i sifirlayip full re-pull yapin
# (TA README "Bakim" bolumu).

[SGB TA - Lookup Gen - Master indicators]
enableSched = 1
cron_schedule = 7 * * * *
dispatch.earliest_time = -4h@h
dispatch.latest_time = now
search = `sgb_ti_index` \
| dedup stix_id \
| eval added_utc=created, modified_utc=modified, source=sgb_source \
| table value, type, connectiontype, criticality_level, source, confidence, category, added_utc, modified_utc, stix_id \
| inputlookup append=t sgb_indicators \
| dedup stix_id \
| where isnotnull(value) AND value!="" \
| outputlookup sgb_indicators
description = SGB master indicator lookup'ini (sgb_indicators) yeni/degisen STIX event'leriyle tazeler. Saatlik.

[SGB TA - Lookup Gen - Domain]
enableSched = 1
cron_schedule = 11 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
search = | inputlookup sgb_indicators \
| where type="domain" \
| table value, connectiontype, criticality_level, source, confidence \
| outputlookup sgb_domain_lookup
description = sgb_domain_lookup'i master lookup'tan uretir. Saatlik.

[SGB TA - Lookup Gen - IP]
enableSched = 1
cron_schedule = 13 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
search = | inputlookup sgb_indicators \
| where type="ip" OR type="ip6" OR type="ip6net" \
| table value, connectiontype, criticality_level, source, confidence \
| outputlookup sgb_ip_lookup
description = sgb_ip_lookup'i master lookup'tan uretir (ip + ip6 + ip6net; CIDR match destekli). Saatlik.

[SGB TA - Lookup Gen - URL]
enableSched = 1
cron_schedule = 15 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
search = | inputlookup sgb_indicators \
| where type="url" \
| table value, connectiontype, criticality_level, source, confidence \
| outputlookup sgb_url_lookup
description = sgb_url_lookup'i master lookup'tan uretir. Saatlik.

[SGB TA - Lookup Gen - Feed count history]
enableSched = 1
cron_schedule = 18 * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
search = | inputlookup sgb_feed_count_history \
| append [| inputlookup sgb_indicators | stats count AS n by type | rename type AS feed | eval _time=now()] \
| where _time >= relative_time(now(), "-90d@d") \
| table _time, feed, n \
| outputlookup sgb_feed_count_history
description = UC-XX-004 feed sagligi icin saatlik indicator sayisi snapshot'i (90 gun tutulur).
